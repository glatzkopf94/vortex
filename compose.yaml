name: "${RESTREAMER_PROJECT_NAME:-restreamer-nkl}"

services:
  restreamer-nkl:
    image: "${RESTREAMER_IMAGE:-ghcr.io/glatzkopf94/restreamer-nistkastenlivestream:0.3.0-dev29}"
    container_name: "${RESTREAMER_CONTAINER_NAME:-vortex}"
    restart: unless-stopped
    ports:
      - "${RESTREAMER_BIND_ADDRESS:-127.0.0.1}:${RESTREAMER_HTTP_PORT:-9080}:8080"
      - "${RESTREAMER_BIND_ADDRESS:-127.0.0.1}:${RESTREAMER_API_PORT:-9181}:8181"
    environment:
      NKL_TIMELAPSE_ENABLE: "${NKL_TIMELAPSE_ENABLE:-true}"
      NKL_TIMELAPSE_ROOT: /core/timelapse
      NKL_TIMELAPSE_QUOTA_BYTES: "${NKL_TIMELAPSE_QUOTA_BYTES:-21474836480}"
      NKL_TIMELAPSE_RESERVE_BYTES: "${NKL_TIMELAPSE_RESERVE_BYTES:-2147483648}"
      # Dynamic playlists, overlay text and generated player pages must bypass
      # Core's five-minute disk cache.
      CORE_STORAGE_DISK_CACHE_TYPES_BLOCK: ".m3u8 .mpd .txt .html .js"
      OVERLAY_JSON_URL: "${OVERLAY_JSON_URL:-}"
      OVERLAY_TEMPERATURE_JSON_URL: "${OVERLAY_TEMPERATURE_JSON_URL:-}"
      OVERLAY_HUMIDITY_JSON_URL: "${OVERLAY_HUMIDITY_JSON_URL:-}"
      OVERLAY_HTTP_HEADER: "${OVERLAY_HTTP_HEADER:-}"
      OVERLAY_TEMPERATURE_HTTP_HEADER: "${OVERLAY_TEMPERATURE_HTTP_HEADER:-}"
      OVERLAY_HUMIDITY_HTTP_HEADER: "${OVERLAY_HUMIDITY_HTTP_HEADER:-}"
      OVERLAY_INTERVAL_SECONDS: "${OVERLAY_INTERVAL_SECONDS:-60}"
      OVERLAY_TEMPERATURE_JQ: "${OVERLAY_TEMPERATURE_JQ:-.value // .temperature // .current.temperature_2m}"
      OVERLAY_HUMIDITY_JQ: "${OVERLAY_HUMIDITY_JQ:-.value // .humidity // .current.relative_humidity_2m}"
      OVERLAY_TEMPERATURE_LABEL: "${OVERLAY_TEMPERATURE_LABEL:-Temp}"
      OVERLAY_HUMIDITY_LABEL: "${OVERLAY_HUMIDITY_LABEL:-F}"
      OVERLAY_TEMPERATURE_DECIMALS: "${OVERLAY_TEMPERATURE_DECIMALS:-1}"
      OVERLAY_HUMIDITY_DECIMALS: "${OVERLAY_HUMIDITY_DECIMALS:-0}"
    volumes:
      - restreamer-config:/core/config
      - restreamer-data:/core/data
      - timelapse:/core/timelapse

volumes:
  restreamer-config:
    name: "${RESTREAMER_CONFIG_VOLUME:-restreamer-nkl-config}"
    external: true
  restreamer-data:
    name: "${RESTREAMER_DATA_VOLUME:-restreamer-nkl-data}"
    external: true
  timelapse:
    name: "${RESTREAMER_TIMELAPSE_VOLUME:-restreamer-nkl-timelapse}"
