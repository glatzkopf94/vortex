name: Build and publish Vortex

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "release.env"

permissions:
  contents: write
  packages: write

concurrency:
  group: nkl-restreamer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  player-browser:
    name: Test public players in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Browser-Test vorbereiten
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix /tmp/nkl-browser-test playwright@1.62.1 video.js@8.17.3 esbuild@0.25.0
          /tmp/nkl-browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Echte HLS-Player mehrfach stoppen und reaktivieren
        env:
          NKL_PLAYWRIGHT: /tmp/nkl-browser-test/node_modules/playwright
        run: node tests/test-player-browser.cjs
      - name: Playerlayout und Zeitmarkierungen
        env:
          NODE_PATH: /tmp/nkl-browser-test/node_modules
        run: |
          node tests/test-player-layout.cjs
          node tests/test-player-markers.cjs

  build:
    name: Build and smoke test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Releasewerte laden und pruefen
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          expected_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GHCR_IMAGE" != "$expected_image" && ! ( "$GITHUB_REPOSITORY" == "glatzkopf94/vortex" && "$GHCR_IMAGE" == "ghcr.io/glatzkopf94/restreamer-nistkastenlivestream" ) ]]; then
            echo "GHCR_IMAGE muss $expected_image entsprechen." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$RELEASE_VERSION" ]]; then
            echo "Der Releasetag muss v$RELEASE_VERSION heissen." >&2
            exit 1
          fi
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"

      - name: FFmpeg fuer Diensttests installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-pyftpdlib

      - name: Statische Tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test-livechasing-manager.py
          python3 tests/test-dvr-retention.py
          python3 tests/test-timelapse.py
          python3 tests/test-timelapse-transfer.py
          node tests/test-timelapse-poster.cjs
          python3 tests/test-player-ui.py
          python3 tests/test-player-cleanup.py
          node tests/test-player-behavior.js
          python3 -m py_compile scripts/migrate-player-1.4.py
          python3 tests/test-timestamp-repair.py
          python3 tests/test-update-agent.py
          python3 tests/test-release-architecture.py
          python3 -m py_compile scripts/migrate-timestamp-repair.py scripts/migrate-dvr-retention.py scripts/verify-multiarch-manifest.py
          ./scripts/check-release.sh
          sh -n install.sh build-local.sh status.sh uninstall.sh bundle/run.sh tests/smoke-test.sh scripts/package-release.sh scripts/check-release.sh scripts/nkl-update-agent.sh

      - name: Bei GitHub Container Registry anmelden
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: FFmpeg nativ bauen
        run: docker build --pull --tag nkl/ffmpeg:9.0.1 ffmpeg

      - name: Restreamer Core nativ bauen und testen
        run: docker build --pull --tag nkl/restreamer-core:${{ steps.release.outputs.release_version }} core

      - name: Restreamer UI nativ bauen und testen
        run: docker build --pull --tag nkl/restreamer-ui:${{ steps.release.outputs.release_version }} ui

      - name: Architekturgebundenes Image zusammensetzen
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.release.outputs.image }}:${{ steps.release.outputs.release_version }}-${{ matrix.arch }}"
          docker build \
            --file bundle/Dockerfile \
            --build-arg FFMPEG_IMAGE=nkl/ffmpeg:9.0.1 \
            --build-arg CORE_IMAGE=nkl/restreamer-core:${{ steps.release.outputs.release_version }} \
            --build-arg RESTREAMER_UI_IMAGE=nkl/restreamer-ui:${{ steps.release.outputs.release_version }} \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="${{ steps.release.outputs.release_version }}" \
            --tag "$image" .
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "linux/${{ matrix.arch }}"
          docker push "$image"

      - name: Fertiges Image in isolierten Volumes pruefen
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          config_volume="nkl-release-smoke-${arch}-config"
          data_volume="nkl-release-smoke-${arch}-data"
          cleanup() {
            docker compose -f compose.yaml down --remove-orphans >/dev/null 2>&1 || true
            docker volume rm "$config_volume" "$data_volume" "${RESTREAMER_TIMELAPSE_VOLUME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          export RESTREAMER_TIMELAPSE_VOLUME="nkl-release-smoke-${arch}-timelapse"
          docker volume create "$config_volume" >/dev/null
          docker volume create "$data_volume" >/dev/null
          cp .env.example .env
          sed -i "s|^RESTREAMER_IMAGE=.*|RESTREAMER_IMAGE=${{ steps.release.outputs.image }}:${{ steps.release.outputs.release_version }}-${arch}|" .env
          sed -i "s|^RESTREAMER_CONFIG_VOLUME=.*|RESTREAMER_CONFIG_VOLUME=${config_volume}|" .env
          sed -i "s|^RESTREAMER_DATA_VOLUME=.*|RESTREAMER_DATA_VOLUME=${data_volume}|" .env
          docker compose -f compose.yaml up --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker compose -f compose.yaml ps
              docker compose -f compose.yaml logs --tail 120
              exit 1
            fi
            sleep 2
          done
          ./tests/smoke-test.sh
          python3 tests/test-container-restart.py "${{ steps.release.outputs.image }}:${{ steps.release.outputs.release_version }}-${arch}"

  publish:
    name: Publish multiarch image and release
    needs: [build, player-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Bei GitHub Container Registry anmelden
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: AMD64 und ARM64 zu einem Image zusammenfuehren
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:$RELEASE_VERSION" \
            --tag "$GHCR_IMAGE:$PRODUCT_VERSION" \
            "$GHCR_IMAGE:$RELEASE_VERSION-amd64" \
            "$GHCR_IMAGE:$RELEASE_VERSION-arm64"
          # Compatibility tags remain available to the already-installed NKL updater.
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:$PRODUCT_VERSION" \
            "$GHCR_IMAGE:$RELEASE_VERSION-amd64" \
            "$GHCR_IMAGE:$RELEASE_VERSION-arm64"
          docker buildx imagetools inspect --raw "$GHCR_IMAGE:$RELEASE_VERSION" > /tmp/nkl-manifest.json
          python3 scripts/verify-multiarch-manifest.py /tmp/nkl-manifest.json

      - name: Schnellinstallationspaket erstellen
        run: ./scripts/package-release.sh

      - name: Workflow-Artefakt speichern
        uses: actions/upload-artifact@v7
        with:
          name: vortex-${{ github.sha }}
          path: |
            dist/restreamer-nistkastenlivestream-*.zip
            dist/restreamer-nistkastenlivestream-*.zip.sha256
            dist/vortex-*.zip
            dist/vortex-*.zip.sha256
          if-no-files-found: error

      - name: Release-Tag und GitHub-Release anlegen
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source release.env
          version="$RELEASE_VERSION"
          tag="v${version}"
          archive="dist/restreamer-nistkastenlivestream-${version}.zip"
          checksum="${archive}.sha256"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              :
            else
              existing_sha=""
            fi
            if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Der Tag ${tag} verweist bereits auf ${existing_sha}, erwartet wurde ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$checksum" "dist/vortex-${version}.zip" "dist/vortex-${version}.zip.sha256" --clobber
            gh release edit "$tag" \
              --title "$PRODUCT_LABEL / $version" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" \
              "$archive" "$checksum" "dist/vortex-${version}.zip" "dist/vortex-${version}.zip.sha256" \
              --target "$GITHUB_SHA" \
              --title "$PRODUCT_LABEL / $version" \
              --notes-file RELEASE_NOTES.md
          fi
